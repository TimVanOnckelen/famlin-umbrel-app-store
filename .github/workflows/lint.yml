name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install yamllint
        run: pip install --user yamllint
      - name: Shell scripts
        run: shellcheck -x .github/scripts/*.sh
      - name: Update script tests
        run: .github/scripts/test-update.sh
      - name: YAML lint and compose validation
        run: .github/scripts/validate.sh
