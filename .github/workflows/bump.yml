name: Bump Famlin version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Famlin version without the leading v (e.g. 0.9.0)
        required: true
  repository_dispatch:
    types: [famlin-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
      - name: Resolve image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/timvanonckelen/famlin:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "Could not resolve digest" >&2; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Update manifests
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          sed -i -E "s|image: ghcr.io/timvanonckelen/famlin:.*|image: ghcr.io/timvanonckelen/famlin:${VERSION}@${DIGEST}|" famlin-famlin/docker-compose.yml
          sed -i -E "s|^version: .*|version: \"${VERSION}\"|" famlin-famlin/umbrel-app.yml
          python3 - <<'PY'
          import os, re
          p = "famlin-famlin/umbrel-app.yml"
          s = open(p).read()
          note = "releaseNotes: >-\n  See https://github.com/TimVanOnckelen/famlin/releases/tag/v%s for what changed.\n" % os.environ["VERSION"]
          s = re.sub(r"releaseNotes: >-\n(?:  .*\n)+", note, s)
          open(p, "w").write(s)
          PY
          git diff --stat
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bump-famlin-${{ env.VERSION }}
          commit-message: "chore: bump Famlin to ${{ env.VERSION }}"
          title: "chore: bump Famlin to ${{ env.VERSION }}"
          body: |
            Updates the image tag (digest-pinned) and `version` to ${{ env.VERSION }}.

            Release notes: https://github.com/TimVanOnckelen/famlin/releases/tag/v${{ env.VERSION }}
          delete-branch: true
